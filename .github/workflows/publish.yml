name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    if: github.repository == 'n5za/osint-mcp'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # required for trusted publishing (no token needed; configure once at
      # https://pypi.org/manage/account/publishing/ for this repo + workflow)
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
